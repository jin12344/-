<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>틀린그림찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>틀린그림찾기</h1>
    </header>

    <!-- 로그인 화면 -->
    <div id="login-screen">
      <div class="login-box">
        <h2>닉네임 입력</h2>
        <input type="text" id="nickname-input" placeholder="닉네임 (최대 10자)" maxlength="10" autocomplete="off">
        <button id="start-btn">게임 시작</button>
      </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="hidden">
      <div id="game-info">
        <span id="timer-display">00:00</span>
        <span id="score-display">0 / 5 발견</span>
        <span id="player-name"></span>
      </div>

      <div id="canvases">
        <div class="canvas-wrap">
          <div class="canvas-label">원본</div>
          <canvas id="canvas-left" width="500" height="380"></canvas>
        </div>
        <div class="canvas-wrap">
          <div class="canvas-label">다른 그림 (여기를 클릭!)</div>
          <canvas id="canvas-right" width="500" height="380"></canvas>
        </div>
      </div>

      <div id="feedback-msg"></div>
      <button id="restart-btn">처음으로</button>
    </div>

    <!-- 완료 화면 -->
    <div id="complete-screen" class="hidden">
      <div class="complete-box">
        <h2>완료!</h2>
        <p id="complete-msg"></p>
        <div class="complete-buttons">
          <button id="play-again-btn">다시 하기</button>
          <button id="back-btn">처음으로</button>
        </div>
      </div>
    </div>

    <!-- 리더보드 -->
    <div id="leaderboard">
      <h2>리더보드</h2>
      <ol id="leaderboard-list">
        <li class="lb-empty">불러오는 중...</li>
      </ol>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
